<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tipp – Dichlormethan</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f9fc;
      color: #1d2939;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main {
      width: min(100%, 540px);
      padding: clamp(28px, 6vw, 48px);
      background: #fff;
      border: 1px solid #e4e8ef;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(26, 46, 76, 0.06);
    }
    h1 {
      margin: 0 0 16px;
      color: #315d90;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.55rem);
      line-height: 1.6;
    }
    strong { font-weight: 750; }
  </style>
</head>
<body>
  <main>
    <h1>Tipp</h1>
    <p>Von Dichlormethan ist nur <strong>eine</strong> Verbindung bekannt.</p>
  </main>
</body>
</html>
